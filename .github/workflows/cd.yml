name: CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to MonsterASP.NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish SistemaGastos.WebApp/SistemaGastos.WebApp.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Take site offline (unlock IIS process)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'EOF'
          import ftplib, os, time

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pwd  = os.environ['FTP_PASS']
          raw  = os.environ['FTP_DIR'].replace('\\', '/')

          with ftplib.FTP(host) as ftp:
              ftp.set_pasv(True)
              ftp.login(user, pwd)
              print('FTP root:', ftp.pwd())
              print('Dirs at root:', ftp.nlst())

              # Try each candidate path until one works
              candidates = [raw, raw.strip('/'), '/', '']
              cwd_ok = False
              for path in candidates:
                  try:
                      if path:
                          ftp.cwd(path)
                      print(f'CWD succeeded: "{path}" -> now at {ftp.pwd()}')
                      cwd_ok = True
                      break
                  except ftplib.error_perm as e:
                      print(f'CWD "{path}" failed: {e}')

              with open('.github/app_offline.htm', 'rb') as f:
                  ftp.storbinary('STOR app_offline.htm', f)
              print('app_offline.htm uploaded successfully')

          time.sleep(8)
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Production.json

      - name: Bring site back online
        if: always()
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'EOF'
          import ftplib, os

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pwd  = os.environ['FTP_PASS']
          raw  = os.environ['FTP_DIR'].replace('\\', '/')

          with ftplib.FTP(host) as ftp:
              ftp.set_pasv(True)
              ftp.login(user, pwd)

              candidates = [raw, raw.strip('/'), '/', '']
              for path in candidates:
                  try:
                      if path:
                          ftp.cwd(path)
                      break
                  except ftplib.error_perm:
                      pass

              try:
                  ftp.delete('app_offline.htm')
                  print('Site is back online')
              except ftplib.error_perm:
                  print('app_offline.htm not found — site already online')
          EOF
