name: CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to MonsterASP.NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish SistemaGastos.WebApp/SistemaGastos.WebApp.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Take site offline (unlock IIS process)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'EOF'
          import ftplib, os, time

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pwd  = os.environ['FTP_PASS']
          d    = os.environ['FTP_DIR'].replace('\\', '/')

          with ftplib.FTP(host) as ftp:
              ftp.set_pasv(True)
              ftp.login(user, pwd)
              ftp.cwd(d)
              with open('.github/app_offline.htm', 'rb') as f:
                  ftp.storbinary('STOR app_offline.htm', f)
              print('app_offline.htm uploaded, waiting for IIS to release DLL locks...')
          time.sleep(8)
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Production.json

      - name: Bring site back online
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'EOF'
          import ftplib, os

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pwd  = os.environ['FTP_PASS']
          d    = os.environ['FTP_DIR'].replace('\\', '/')

          with ftplib.FTP(host) as ftp:
              ftp.set_pasv(True)
              ftp.login(user, pwd)
              ftp.cwd(d)
              try:
                  ftp.delete('app_offline.htm')
                  print('app_offline.htm deleted, site is back online')
              except ftplib.error_perm:
                  print('app_offline.htm not found, nothing to delete')
          EOF
