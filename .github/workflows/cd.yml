name: CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to MonsterASP.NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish SistemaGastos.WebApp/SistemaGastos.WebApp.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Take site offline (unlock IIS process)
        run: |
          SERVER_DIR=$(echo "${{ secrets.FTP_SERVER_DIR }}" | tr '\\' '/')
          lftp -e "put .github/app_offline.htm -o ${SERVER_DIR}app_offline.htm; quit" \
            -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            "${{ secrets.FTP_HOST }}"
          sleep 8

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Production.json

      - name: Bring site back online
        if: always()
        run: |
          SERVER_DIR=$(echo "${{ secrets.FTP_SERVER_DIR }}" | tr '\\' '/')
          lftp -e "rm -f ${SERVER_DIR}app_offline.htm; quit" \
            -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            "${{ secrets.FTP_HOST }}"
